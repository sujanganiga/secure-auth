spring.config.import=optional:file:./secrets.properties
spring.application.name=Backend
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/authentication
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.org.hdfclife.backend=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

# Rate Limiting
login.rate-limit.user-limit=5
login.rate-limit.ip-limit=10
login.rate-limit.refresh-period-seconds=60

# Mock External Login Service
mock.login.url=http://localhost:${server.port}/mock/external-login
mock.login.failure=false

# Login Circuit Breaker
login.circuit-breaker.failure-rate-threshold=50
login.circuit-breaker.minimum-number-of-calls=3
login.circuit-breaker.sliding-window-size=10
login.circuit-breaker.wait-duration-in-open-state-seconds=10
login.circuit-breaker.permitted-number-of-calls-in-half-open-state=2

# JWT Refresh Token
jwt.refresh-expiration=7200000

# Database Circuit Breaker
database.circuit-breaker.failure-rate-threshold=50
database.circuit-breaker.minimum-number-of-calls=3
database.circuit-breaker.sliding-window-size=10
database.circuit-breaker.wait-duration-in-open-state-seconds=10
database.circuit-breaker.permitted-number-of-calls-in-half-open-state=2





